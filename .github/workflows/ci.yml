name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: congdongngonngu_phase22_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d congdongngonngu_phase22_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate read-only SSH preflight
        run: bash -n scripts/deploy/ssh-preflight.sh && shellcheck scripts/deploy/ssh-preflight.sh

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Native packaging and TEST target guards
        run: node --test scripts/build-phase30-processors.test.cjs scripts/package-phase30-time.test.cjs scripts/phase30-sql-target.test.cjs

      - name: Package checksum-pinned TEST native processors
        run: npm run build:attachments -- --download

      - name: Unit tests
        run: npm test -- --runInBand
        env:
          PHASE30_PROCESSOR_DIR: ${{ github.workspace }}/dist/attachments/processors
          PHASE30_REQUIRE_NATIVE_TESTS: 'true'

      - name: Bounded native video repeatability
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3
          do
            printf 'Synthetic native pipeline run %s/3\n' "$attempt"
            npm test -- --runInBand --runTestsByPath src/attachments/video-processing/native-pipeline.spec.ts
          done
        env:
          PHASE30_PROCESSOR_DIR: ${{ github.workspace }}/dist/attachments/processors
          PHASE30_REQUIRE_NATIVE_TESTS: 'true'

      - name: End-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

      - name: PostgreSQL18 study-group transaction proof
        run: npm run test:study-groups
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: PostgreSQL18 reviewed Library relation proof
        run: npm run test:library-relations
        env:
          PHASE23_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: Prepare ephemeral PostgreSQL18 baseline extensions
        run: |
          node <<'NODE'
          const { Pool } = require('pg');
          const url = new URL(process.env.PHASE22_TEST_DATABASE_URL);
          if (url.hostname !== 'localhost' || url.pathname !== '/congdongngonngu_phase22_ci') throw new Error('CI database identity mismatch');
          const pool = new Pool({ connectionString: url.toString() });
          (async () => {
            try {
              const { rows } = await pool.query("SELECT current_database() AS db, current_schema() AS schema, current_setting('server_version_num')::int AS version");
              if (rows[0].db !== 'congdongngonngu_phase22_ci' || rows[0].schema !== 'public' || rows[0].version < 180000) throw new Error('CI PostgreSQL18 preflight failed');
              await pool.query('CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public; CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public; CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public');
            } finally { await pool.end(); }
          })().catch(() => { console.error('CI baseline extension preparation failed'); process.exitCode = 1; });
          NODE
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: PostgreSQL18 connection transactions and notification privacy
        run: npm run test:connections
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: PostgreSQL18 Community acceptance and notification privacy
        run: npm run test:community-collaboration
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: Attachment TEST connection guards
        run: node --test scripts/phase30-sql-target.test.cjs

      - name: PostgreSQL18 attachment ownership and lifecycle proof
        run: npm run test:attachments
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: Security audit
        run: npm audit --audit-level=high

  production-preflight:
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate read-only SSH preflight
        run: bash -n scripts/deploy/ssh-preflight.sh && shellcheck scripts/deploy/ssh-preflight.sh
      - name: Inspect existing production SSH and deployment prerequisites
        env:
          CDNN_SSH_PRIVATE_KEY: ${{ secrets.CDNN_SSH_PRIVATE_KEY }}
          CDNN_KNOWN_HOSTS: ${{ secrets.CDNN_KNOWN_HOSTS }}
          CDNN_SSH_HOST: ${{ secrets.CDNN_SSH_HOST }}
          CDNN_SSH_USER: ${{ secrets.CDNN_SSH_USER }}
        run: bash scripts/deploy/ssh-preflight.sh
