name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: congdongngonngu_phase22_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d congdongngonngu_phase22_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deployment shell validation
        run: bash -n scripts/deploy/transport.sh && bash -n scripts/deploy/release.sh && bash -n scripts/deploy/bootstrap.sh && shellcheck scripts/deploy/*.sh

      - name: Deployment safety tests
        run: node --test scripts/deploy/*.node-spec.cjs

      - name: Isolated Linux accepted-connection ownership tests
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env -u NODE_OPTIONS -u NODE_PATH CDNN_CORRELATION_LINUX_REQUIRED=1 "$(command -v node)" --test scripts/deploy/endpoint-correlation*.node-spec.cjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Native packaging and TEST target guards
        run: node --test scripts/build-phase30-processors.test.cjs scripts/package-phase30-time.test.cjs scripts/phase30-sql-target.test.cjs

      - name: Package checksum-pinned TEST native processors
        run: npm run build:attachments -- --download

      - name: Unit tests
        run: npm test -- --runInBand
        env:
          PHASE30_PROCESSOR_DIR: ${{ github.workspace }}/dist/attachments/processors
          PHASE30_REQUIRE_NATIVE_TESTS: 'true'

      - name: Bounded native video repeatability
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3
          do
            printf 'Synthetic native pipeline run %s/3\n' "$attempt"
            npm test -- --runInBand --runTestsByPath src/attachments/video-processing/native-pipeline.spec.ts
          done
        env:
          PHASE30_PROCESSOR_DIR: ${{ github.workspace }}/dist/attachments/processors
          PHASE30_REQUIRE_NATIVE_TESTS: 'true'

      - name: End-to-end tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

      - name: Stage already-reviewed pinned application for PM2 rehearsal
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),os=require('node:os'),crypto=require('node:crypto');
          (async()=>{
            const temp=fs.realpathSync(process.env.RUNNER_TEMP),root=path.join(temp,'cdnn-pinned-application');
            if(fs.statSync(temp).uid!==process.getuid()||temp.startsWith('/var/www'))throw Error('Unsafe runner temp');
            fs.mkdirSync(root,{mode:0o700});
            const response=await fetch('https://api.github.com/repos/CongDongNgonNgu/CongDongNgonNgu-Back-End/actions/artifacts/12735767418/zip',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},signal:AbortSignal.timeout(60000)});
            if(!response.ok)throw Error('Reviewed baseline artifact unavailable; do not substitute a new source or build');
            const bytes=Buffer.from(await response.arrayBuffer());
            if(crypto.createHash('sha256').update(bytes).digest('hex')!=='7dc2bce0d6fa3891dbede35e6928c4ef66ec14a8baf99325ade51fe3f57b7f7f')throw Error('Reviewed baseline archive mismatch');
            fs.writeFileSync(path.join(root,'reviewed-baseline.zip'),bytes,{flag:'wx',mode:0o600});
            console.log('Reviewed pinned9f baseline archive digest verified; no provenance rebuild');
          })().catch(()=>{console.error('PINNED_BASELINE_STAGING_FAILED');process.exitCode=1;});
          NODE
          unzip -q "$RUNNER_TEMP/cdnn-pinned-application/reviewed-baseline.zip" -d "$RUNNER_TEMP/cdnn-pinned-application"
          npm ci --prefix "$RUNNER_TEMP/cdnn-pinned-application/source" --include=dev --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Representative isolated PM2 launch, resurrection and recovery
        timeout-minutes: 8
        env:
          CDNN_TEST_APPLICATION_ROOT: ${{ runner.temp }}/cdnn-pinned-application/source
          CDNN_TEST_PM2_ROOT: ${{ runner.temp }}/cdnn-pm2-tools-7.0.3/node_modules/pm2
          CDNN_PM2_REHEARSAL_REPORT: ${{ runner.temp }}/cdnn-pm2-rehearsal-summary.json
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.18.1
          tool_root="$RUNNER_TEMP/cdnn-pm2-tools-7.0.3"
          test ! -e "$tool_root"
          mkdir -m 700 "$tool_root"
          npm install --prefix "$tool_root" --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org --save-exact pm2@7.0.3
          node -e 'const fs=require("node:fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));for(const x of Object.values(p.packages||{})){if(x.resolved){const u=new URL(x.resolved);if(u.origin!=="https://registry.npmjs.org"||u.username||u.password||u.search||u.hash)throw Error("Unexpected public test-tool lock source");}}' "$tool_root/package-lock.json"
          node scripts/deploy/pm2-recovery-rehearsal.cjs

      - name: Preserve sanitized PM2 rehearsal and public test-tool lock
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: isolated-pm2-recovery-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ runner.temp }}/cdnn-pm2-rehearsal-summary.json
            ${{ runner.temp }}/cdnn-pm2-tools-7.0.3/package-lock.json

      - name: PostgreSQL18 study-group transaction proof
        run: npm run test:study-groups
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: PostgreSQL18 reviewed Library relation proof
        run: npm run test:library-relations
        env:
          PHASE23_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: Prepare ephemeral PostgreSQL18 baseline extensions
        run: |
          node <<'NODE'
          const { Pool } = require('pg');
          const url = new URL(process.env.PHASE22_TEST_DATABASE_URL);
          if (url.hostname !== 'localhost' || url.pathname !== '/congdongngonngu_phase22_ci') throw new Error('CI database identity mismatch');
          const pool = new Pool({ connectionString: url.toString() });
          (async () => {
            try {
              const { rows } = await pool.query("SELECT current_database() AS db, current_schema() AS schema, current_setting('server_version_num')::int AS version");
              if (rows[0].db !== 'congdongngonngu_phase22_ci' || rows[0].schema !== 'public' || rows[0].version < 180000) throw new Error('CI PostgreSQL18 preflight failed');
              await pool.query('CREATE EXTENSION IF NOT EXISTS pgcrypto WITH SCHEMA public; CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA public; CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public');
            } finally { await pool.end(); }
          })().catch(() => { console.error('CI baseline extension preparation failed'); process.exitCode = 1; });
          NODE
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: PostgreSQL18 connection transactions and notification privacy
        run: npm run test:connections
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: PostgreSQL18 Community acceptance and notification privacy
        run: npm run test:community-collaboration
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: Attachment TEST connection guards
        run: node --test scripts/phase30-sql-target.test.cjs

      - name: PostgreSQL18 attachment ownership and lifecycle proof
        run: npm run test:attachments
        env:
          PHASE22_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/congdongngonngu_phase22_ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

  production:
    needs: quality
    if: ${{ false && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/production.yml
    permissions:
      contents: read
